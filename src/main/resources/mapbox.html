<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Map Picker avec Leaflet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    const map = L.map('map', {
        center: [36.0, 10.0],
        zoom: 6,
        zoomControl: true
    });

    // Corrigé ici
    L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/streets-v11/tiles/{z}/{x}/{y}?access_token=pk.eyJ1IjoiYWNocmFmbGgiLCJhIjoiY203b21nenFsMDVsbTJqc2VzYjlreHRtYSJ9._1FrGi5hIX7QpG1_X7b1Ug', {
        tileSize: 512,
        zoomOffset: -1,
        detectRetina: true,
        maxZoom: 18,
        minZoom: 1,
        crossOrigin: true,
        attribution: '© Mapbox © OpenStreetMap'
    }).addTo(map);

    let marker = null;

    map.on('click', function(e) {
        const { lat, lng } = e.latlng;

        if (marker) {
            map.removeLayer(marker);
        }

        marker = L.marker([lat, lng]).addTo(map);

        // Envoie les coordonnées
        if (window.javaConnector) {
            window.javaConnector.sendCoordinates(lng, lat);
        }
    });
</script>
</body>
</html>
