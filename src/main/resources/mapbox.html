<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Map Picker avec Leaflet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Feuilles de style Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Script Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    const map = L.map('map').setView([36.0, 10.0], 6); // Tunisie par défaut

    // Tuiles Mapbox via Leaflet
    L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/streets-v11/tiles/{z}/{x}/{y}?access_token=pk.eyJ1IjoiYWNocmFmbGgiLCJhIjoiY203b21nenFsMDVsbTJqc2VzYjlreHRtYSJ9._1FrGi5hIX7QpG1_X7b1Ug', {
        tileSize: 512,
        zoomOffset: -1,
        attribution: '© Mapbox © OpenStreetMap'
    }).addTo(map);

    let marker = null;

    // Lorsque l'utilisateur clique sur la carte
    map.on('click', function(e) {
        const { lat, lng } = e.latlng;

        // Supprimer l'ancien marqueur si présent
        if (marker) {
            map.removeLayer(marker);
        }

        // Ajouter un nouveau marqueur
        marker = L.marker([lat, lng]).addTo(map);

        // Appel vers Java via JSObject (bridge)
        if (window.javaConnector) {
            window.javaConnector.sendCoordinates(lng, lat);
        }
    });
</script>
</body>
</html>
